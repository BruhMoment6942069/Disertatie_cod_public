<svg xmlns="http://www.w3.org/2000/svg" width="740" height="620" viewBox="0 0 740 620" role="img" font-family="Segoe UI, Calibri, Arial, sans-serif">
<title>Fluxul de comunica&#539;ie UDP &#238;ntre sta&#539;ia de control &#537;i ESP32</title>
<desc>Diagram&#259; de secven&#539;&#259; &#238;n trei faze: descoperirea prin difuziune &#537;i confirmare, regimul permanent cu telemetrie la 50 Hz &#537;i comenzi de vitez&#259;, mod &#537;i keepalive, apoi comportamentul la pierderea leg&#259;turii prin cele dou&#259; temporiz&#259;ri de prospe&#539;ime.</desc>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="740" height="620" fill="#FFFFFF"/>

<!-- benzi de faz&#259; -->
<rect x="30" y="80" width="680" height="120" rx="6" fill="#F7F6F2"/>
<rect x="30" y="210" width="680" height="220" rx="6" fill="#F7F6F2"/>
<rect x="30" y="440" width="680" height="125" rx="6" fill="#F7F6F2"/>

<text x="42" y="98" font-size="12" font-weight="500" fill="#888780">1 &#183; Descoperire</text>
<text x="42" y="228" font-size="12" font-weight="500" fill="#888780">2 &#183; Regim permanent</text>
<text x="42" y="458" font-size="12" font-weight="500" fill="#888780">3 &#183; Pierderea leg&#259;turii</text>

<!-- linii de via&#539;&#259; -->
<line x1="140" y1="69" x2="140" y2="565" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="560" y1="69" x2="560" y2="565" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>

<!-- antete -->
<rect x="45" y="25" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="61" y="47" font-size="15" font-weight="500" fill="#2C2C2A">Sta&#539;ie de control</text>
<text x="61" y="62" font-size="11" fill="#5F5E5A">aplica&#539;ia Qt</text>

<rect x="465" y="25" width="190" height="44" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="481" y="47" font-size="15" font-weight="500" fill="#2C2C2A">ESP32</text>
<text x="481" y="62" font-size="11" fill="#5F5E5A">netTask &#183; nucleul 0</text>

<!-- faza 1 -->
<text x="350" y="116" font-size="11.5" fill="#712B13" text-anchor="middle">&#8222;Connected&#8221; &#183; 9 octe&#539;i &#183; difuziune</text>
<line x1="140" y1="128" x2="560" y2="128" stroke="#993C1D" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a)"/>
<text x="350" y="142" font-size="10" fill="#5F5E5A" text-anchor="middle">c&#259;tre adresa de difuziune a fiec&#259;rei interfe&#539;e active</text>

<text x="350" y="164" font-size="11.5" fill="#085041" text-anchor="middle">&#8222;Connected&#8221; &#183; confirmare</text>
<line x1="560" y1="176" x2="140" y2="176" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#a)"/>
<text x="350" y="190" font-size="10" fill="#5F5E5A" text-anchor="middle">ESP32 memoreaz&#259; IP + port &#537;i porne&#537;te fluxul</text>

<!-- faza 2 -->
<text x="350" y="252" font-size="11.5" fill="#085041" text-anchor="middle">MOTOR_POS &#183; 19 octe&#539;i &#183; la fiecare 20 ms (50 Hz)</text>
<line x1="560" y1="264" x2="140" y2="264" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#a)"/>
<text x="350" y="278" font-size="10" fill="#5F5E5A" text-anchor="middle">4 &#215; pozi&#539;ie int32 little-endian + indicatorul g_homed</text>

<text x="350" y="302" font-size="11.5" fill="#712B13" text-anchor="middle">SPEED &#183; 18 octe&#539;i &#183; la fiecare pereche de cadre</text>
<line x1="140" y1="314" x2="560" y2="314" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="350" y="328" font-size="10" fill="#5F5E5A" text-anchor="middle">4 &#215; vitez&#259; int32, grade pe secund&#259;</text>

<text x="350" y="352" font-size="11.5" fill="#712B13" text-anchor="middle">MODE &#183; 2 octe&#539;i &#160;sau&#160; TARGET &#183; 9 octe&#539;i &#183; la eveniment</text>
<line x1="140" y1="364" x2="560" y2="364" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="350" y="378" font-size="10" fill="#5F5E5A" text-anchor="middle">regimul de lucru, respectiv pozi&#539;ia-&#539;int&#259; din interfa&#539;a manual&#259;</text>

<text x="350" y="400" font-size="11.5" fill="#712B13" text-anchor="middle">keepalive &#183; 1 octet &#183; la fiecare 1500 ms</text>
<line x1="140" y1="412" x2="560" y2="412" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>

<!-- faza 3 -->
<path d="M560 476 h-24 v18 h24" fill="none" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="526" y="490" font-size="11" fill="#712B13" text-anchor="end">300 ms f&#259;r&#259; SPEED &#8594; toate vitezele devin 0</text>

<path d="M140 516 h24 v18 h-24" fill="none" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#a)"/>
<text x="174" y="530" font-size="11" fill="#085041">150 ms f&#259;r&#259; MOTOR_POS &#8594; afi&#537;ajul se gole&#537;te</text>

<text x="42" y="556" font-size="11" fill="#5F5E5A">WiFi pierdut &#8594; fluxul se opre&#537;te &#537;i totul se reia de la faza 1</text>

<!-- legend&#259; -->
<rect x="42" y="585" width="12" height="12" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="60" y="595" font-size="11" fill="#5F5E5A">comenzi: PC &#8594; ESP32</text>
<rect x="215" y="585" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="233" y="595" font-size="11" fill="#5F5E5A">telemetrie: ESP32 &#8594; PC</text>
<line x1="420" y1="591" x2="448" y2="591" stroke="#888780" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="456" y="595" font-size="11" fill="#5F5E5A">difuziune (restul sunt unicast)</text>
</svg>
