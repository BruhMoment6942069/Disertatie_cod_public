<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" font-family="Segoe UI, Calibri, Arial, sans-serif">
<title>Geometria calculului de &#238;n&#259;l&#539;ime</title>
<desc>Vedere lateral&#259;: fiecare camer&#259; se afl&#259; la &#238;n&#259;l&#539;imea h deasupra pl&#259;cii &#537;i la distan&#539;a orizontal&#259; D fa&#539;&#259; de minge. &#206;n&#259;l&#539;imea mingii rezult&#259; din h plus produsul dintre distan&#539;a orizontal&#259; &#537;i tangenta unghiului de vizare. Cele dou&#259; capete produc estim&#259;ri independente, iar diferen&#539;a dintre ele este dezacordul delta z.</desc>

<defs>
  <marker id="dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 2L9 5L2 8" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="760" height="450" fill="#FFFFFF"/>

<!-- placa -->
<line x1="45" y1="360" x2="730" y2="360" stroke="#2C2C2A" stroke-width="1.6"/>
<g stroke="#B4B2A9" stroke-width="1">
  <path d="M52 360 L44 372 M72 360 L64 372 M92 360 L84 372 M112 360 L104 372 M132 360 L124 372 M152 360 L144 372 M172 360 L164 372 M192 360 L184 372 M212 360 L204 372 M232 360 L224 372 M252 360 L244 372 M272 360 L264 372 M292 360 L284 372 M312 360 L304 372 M332 360 L324 372 M352 360 L344 372 M372 360 L364 372 M392 360 L384 372 M412 360 L404 372 M432 360 L424 372 M452 360 L444 372 M472 360 L464 372 M492 360 L484 372 M512 360 L504 372 M532 360 L524 372 M552 360 L544 372 M572 360 L564 372 M592 360 L584 372 M612 360 L604 372 M632 360 L624 372 M652 360 L644 372 M672 360 L664 372 M692 360 L684 372 M712 360 L704 372 M732 360 L724 372"/>
</g>
<text x="45" y="390" font-size="12" fill="#5F5E5A">placa &#8212; planul de referin&#539;&#259; pentru &#238;n&#259;l&#539;ime</text>

<!-- orizontala prin centrele optice -->
<line x1="110" y1="270" x2="575" y2="270" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>

<!-- ghidaj vertical prin minge -->
<line x1="560" y1="128" x2="560" y2="345" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>

<!-- camera 0 -->
<rect x="86" y="261" width="24" height="18" rx="2" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="110" cy="270" r="3.5" fill="#0F6E56"/>
<text x="98" y="248" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle">camera 0</text>

<!-- camera 1 -->
<rect x="216" y="261" width="24" height="18" rx="2" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="240" cy="270" r="3.5" fill="#993C1D"/>
<text x="228" y="248" font-size="12.5" font-weight="500" fill="#712B13" text-anchor="middle">camera 1</text>

<!-- razele -->
<line x1="110" y1="270" x2="560" y2="138" stroke="#0F6E56" stroke-width="1.6"/>
<line x1="240" y1="270" x2="560" y2="162" stroke="#993C1D" stroke-width="1.6"/>

<!-- unghiurile -->
<path d="M165 270 A55 55 0 0 0 162.8 254.6" fill="none" stroke="#0F6E56" stroke-width="1"/>
<text x="174" y="264" font-size="12.5" fill="#085041">&#949;&#8320;</text>
<path d="M285 270 A45 45 0 0 0 282.6 255.6" fill="none" stroke="#993C1D" stroke-width="1"/>
<text x="294" y="264" font-size="12.5" fill="#712B13">&#949;&#8321;</text>

<!-- mingea -->
<circle cx="560" cy="150" r="15" fill="#F1EFE8" stroke="#2C2C2A" stroke-width="1.2"/>
<text x="560" y="112" font-size="12.5" font-weight="500" fill="#2C2C2A" text-anchor="middle">mingea</text>

<!-- capetele razelor -->
<line x1="552" y1="138" x2="568" y2="138" stroke="#0F6E56" stroke-width="1.4"/>
<line x1="552" y1="162" x2="568" y2="162" stroke="#993C1D" stroke-width="1.4"/>
<text x="538" y="133" font-size="12" fill="#085041" text-anchor="end">z&#8320;</text>
<text x="538" y="180" font-size="12" fill="#712B13" text-anchor="end">z&#8321;</text>

<!-- dezacordul -->
<line x1="578" y1="138" x2="614" y2="138" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="578" y1="162" x2="614" y2="162" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="602" y1="138" x2="602" y2="162" stroke="#5F5E5A" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="602" y="128" font-size="12.5" fill="#5F5E5A" text-anchor="middle">&#916;z</text>

<!-- ridicarea D0 tan eps0 -->
<line x1="560" y1="270" x2="560" y2="138" stroke="#5F5E5A" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="572" y="212" font-size="12.5" fill="#5F5E5A">D&#8320; &#183; tan &#949;&#8320;</text>

<!-- inaltimea camerei -->
<line x1="70" y1="270" x2="86" y2="270" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="70" y1="270" x2="70" y2="360" stroke="#5F5E5A" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="60" y="319" font-size="12.5" fill="#5F5E5A" text-anchor="end">h</text>

<!-- inaltimea mingii -->
<line x1="578" y1="150" x2="712" y2="150" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="700" y1="150" x2="700" y2="360" stroke="#5F5E5A" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="712" y="259" font-size="12.5" fill="#5F5E5A">z</text>

<!-- distantele orizontale -->
<line x1="110" y1="304" x2="560" y2="304" stroke="#0F6E56" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="335" y="298" font-size="12.5" fill="#085041" text-anchor="middle">D&#8320;</text>
<line x1="240" y1="330" x2="560" y2="330" stroke="#993C1D" stroke-width="1" marker-start="url(#dim)" marker-end="url(#dim)"/>
<text x="400" y="324" font-size="12.5" fill="#712B13" text-anchor="middle">D&#8321;</text>

<!-- note -->
<text x="45" y="418" font-size="11.5" fill="#5F5E5A">&#949; = &#946; + &#966;<tspan baseline-shift="sub" font-size="9">y</tspan> &#8212; unghiul de &#238;nclinare al capului plus abaterea mingii pe vertical&#259; &#238;n cadru</text>
<text x="45" y="436" font-size="11.5" fill="#5F5E5A">Dezacordul &#916;z este exagerat pentru lizibilitate; &#238;n func&#539;ionare normal&#259; este de ordinul zecilor de milimetri.</text>
</svg>
