<svg xmlns="http://www.w3.org/2000/svg" width="700" height="630" viewBox="0 0 700 630" role="img" font-family="Segoe UI, Calibri, Arial, sans-serif">
<title>Poarta de validare a m&#259;sur&#259;torii de distan&#539;&#259;</title>
<desc>Cinci condi&#539;ii verificate succesiv &#238;nainte de publicarea unei solu&#539;ii: sincronizarea perechii de cadre, referen&#539;ierea axelor, prospe&#539;imea pozi&#539;iilor motoarelor, decalajul temporal dintre cadre &#537;i validitatea geometric&#259;. Orice e&#537;ec gole&#537;te afi&#537;ajul &#238;n loc s&#259; publice o valoare.</desc>

<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="700" height="630" fill="#FFFFFF"/>

<!-- 1 -->
<rect x="60" y="40" width="280" height="48" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="76" y="69" font-size="13" fill="#2C2C2A">Ambele camere au raportat?</text>
<line x1="340" y1="64" x2="400" y2="64" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="370" y="58" font-size="10" fill="#888780" text-anchor="middle">nu</text>
<text x="410" y="68" font-size="11" fill="#712B13">a&#537;teapt&#259; urm&#259;toarea pereche</text>
<line x1="200" y1="88" x2="200" y2="140" stroke="#888780" stroke-width="1.2" marker-end="url(#a)"/>
<text x="210" y="118" font-size="10" fill="#888780">da</text>

<!-- 2 -->
<rect x="60" y="140" width="280" height="48" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="76" y="169" font-size="13" fill="#2C2C2A">Axele sunt referen&#539;iate?</text>
<line x1="340" y1="164" x2="400" y2="164" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="370" y="158" font-size="10" fill="#888780" text-anchor="middle">nu</text>
<text x="410" y="161" font-size="11" fill="#712B13">gole&#537;te afi&#537;ajul</text>
<text x="410" y="175" font-size="10" fill="#5F5E5A">originea pa&#537;ilor este arbitrar&#259;</text>
<line x1="200" y1="188" x2="200" y2="240" stroke="#888780" stroke-width="1.2" marker-end="url(#a)"/>
<text x="210" y="218" font-size="10" fill="#888780">da</text>

<!-- 3 -->
<rect x="60" y="240" width="280" height="48" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="76" y="269" font-size="13" fill="#2C2C2A">Pozi&#539;ii motoare mai noi de 150 ms?</text>
<line x1="340" y1="264" x2="400" y2="264" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="370" y="258" font-size="10" fill="#888780" text-anchor="middle">nu</text>
<text x="410" y="261" font-size="11" fill="#712B13">gole&#537;te &#537;i consemneaz&#259; &#238;n jurnal</text>
<text x="410" y="275" font-size="10" fill="#5F5E5A">flux mort, nu m&#259;sur&#259;toare stabil&#259;</text>
<line x1="200" y1="288" x2="200" y2="340" stroke="#888780" stroke-width="1.2" marker-end="url(#a)"/>
<text x="210" y="318" font-size="10" fill="#888780">da</text>

<!-- 4 -->
<rect x="60" y="340" width="280" height="48" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="76" y="369" font-size="13" fill="#2C2C2A">Decalaj &#238;ntre cadre sub 40 ms?</text>
<line x1="340" y1="364" x2="400" y2="364" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="370" y="358" font-size="10" fill="#888780" text-anchor="middle">nu</text>
<text x="410" y="361" font-size="11" fill="#712B13">gole&#537;te afi&#537;ajul</text>
<text x="410" y="375" font-size="10" fill="#5F5E5A">dou&#259; momente diferite, o singur&#259; &#539;int&#259;</text>
<line x1="200" y1="388" x2="200" y2="440" stroke="#888780" stroke-width="1.2" marker-end="url(#a)"/>
<text x="210" y="418" font-size="10" fill="#888780">da</text>

<!-- 5 -->
<rect x="60" y="440" width="280" height="48" rx="6" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/>
<text x="76" y="469" font-size="13" fill="#2C2C2A">Solu&#539;ie geometric&#259; valid&#259;?</text>
<line x1="340" y1="464" x2="400" y2="464" stroke="#993C1D" stroke-width="1.2" marker-end="url(#a)"/>
<text x="370" y="458" font-size="10" fill="#888780" text-anchor="middle">nu</text>
<text x="410" y="461" font-size="11" fill="#712B13">respinge, cu diagnostic diferen&#539;iat</text>
<text x="410" y="475" font-size="10" fill="#5F5E5A">raze paralele sau intersec&#539;ie &#238;n spate</text>
<line x1="200" y1="488" x2="200" y2="540" stroke="#888780" stroke-width="1.2" marker-end="url(#a)"/>
<text x="210" y="518" font-size="10" fill="#888780">da</text>

<!-- rezultat -->
<rect x="60" y="540" width="280" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="76" y="564" font-size="14" font-weight="500" fill="#085041">Public&#259; m&#259;sur&#259;toarea</text>
<text x="76" y="582" font-size="11" fill="#0F6E56">slant, x, y, z &#537;i dezacordul de &#238;n&#259;l&#539;ime</text>
</svg>
